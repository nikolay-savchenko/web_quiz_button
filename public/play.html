<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Кнопка</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
  .hidden { display: none !important; }

  #picker { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 24px; gap: 14px; }
  #picker h1 { font-size: 26px; margin: 0 0 10px; text-align: center; }
  .team-btn { border: 0; border-radius: 16px; padding: 22px; font-size: 22px; font-weight: 700; color: #fff; }

  #game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); font-size: 15px; background: #000; }
  #bar .name { font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar .score { font-variant-numeric: tabular-nums; font-weight: 700; }
  #bar a { color: #888; text-decoration: none; font-size: 13px; }
  #net { width: 10px; height: 10px; border-radius: 50%; background: #c0392b; flex: none; }
  #net.ok { background: #2ecc71; } #net.slow { background: #f1c40f; }
  #ping { color: #666; font-size: 12px; font-variant-numeric: tabular-nums; }

  #buzz { position: relative; overflow: hidden; flex: 1; margin: 14px; margin-bottom: max(14px, env(safe-area-inset-bottom)); border-radius: 28px;
          display: flex; align-items: center; justify-content: center; text-align: center; touch-action: none;
          background: #333; color: #aaa; transition: background .08s, transform .05s; }
  #buzzText { font-weight: 800; font-size: 44px; line-height: 1.1; padding: 20px; pointer-events: none; }
  #buzzText small { display: block; font-size: 18px; font-weight: 500; margin-top: 12px; opacity: .85; }
  #buzz.go { background: #27ae60; color: #fff; box-shadow: 0 0 60px #27ae6088; }
  #buzz.go:active { transform: scale(.98); }
  #buzz.pressed { background: #f1c40f; color: #222; }
  #buzz.win { color: #fff; animation: pulse .8s infinite alternate; }
  #buzz.penalty { background: #8e1b10; color: #fff; }
  #buzz.lose { background: #2a2a2a; color: #777; }
  #buzz.arena { background: #161616; box-shadow: none; }
  #buzz.arena:active { transform: none; }
  #buzz.swipe { background: #1f6f43; color: #fff; }
  #buzz.swipe:active { transform: none; }
  #buzz.shake { animation: shake .25s; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.35); } }
  @keyframes shake { 0%,100% { translate: 0; } 25% { translate: -10px; } 75% { translate: 10px; } }

  /* бегающая кнопка */
  #ball { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center;
          font-weight: 800; font-size: 20px; color: #fff; background: #27ae60; box-shadow: 0 0 30px #27ae60aa; will-change: transform; }
  #ball.wait { background: #444; color: #aaa; box-shadow: none; }

  /* свайпы */
  .arrows { display: flex; gap: 18px; justify-content: center; font-size: 96px; line-height: 1; }
  .arrows .done { opacity: .25; }
  .arrows .next { text-shadow: 0 0 24px #fff; animation: nudge .7s infinite alternate; }
  @keyframes nudge { from { transform: scale(1); } to { transform: scale(1.15); } }
</style>
</head>
<body>
  <div id="picker">
    <h1>Выберите команду</h1>
    <div id="teamList" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>

  <div id="game" class="hidden">
    <div id="bar">
      <span id="net"></span>
      <span class="name" id="teamName"></span>
      <span class="score" id="teamScore"></span>
      <span id="ping"></span>
      <a href="#" id="change">сменить</a>
    </div>
    <div id="buzz"><div id="buzzText">…</div><div id="ball" class="hidden">ЖМИ</div></div>
  </div>

<script src="/sync.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let state = null;
  let myId = null;
  let myTeam = localStorage.getItem('quiz.team') || null;
  let localPressKey = null; // ключ открытия, на котором этот телефон уже нажал
  let wakeLock = null;
  // прогресс свайпа (на текущем открытии кнопок)
  let swipe = { key: null, stage: 0, tracking: false, x: 0, y: 0 };

  const conn = QuizSync.createConnection({
    onOpen: () => conn.send({ type: 'hello', role: 'player', teamId: myTeam }),
    onMessage: (m) => {
      if (m.type === 'you') myId = m.id;
      else if (m.type === 'state') {
        state = m;
        if (myTeam && !state.teams.find((t) => t.id === myTeam)) { myTeam = null; localStorage.removeItem('quiz.team'); }
        render();
      } else if (m.type === 'event') {
        if (m.name === 'winner' && m.teamId === myTeam) vibrate([80, 60, 200]);
        if (m.name === 'falseStart' && m.teamId === myTeam) vibrate([300]);
      }
    },
    onStatus: () => renderNet(),
  });

  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => (wakeLock = null)); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  function pickTeam(id) {
    myTeam = id;
    localStorage.setItem('quiz.team', id);
    conn.send({ type: 'join', teamId: id });
    keepAwake();
    render();
  }
  $('change').onclick = (e) => { e.preventDefault(); myTeam = null; localStorage.removeItem('quiz.team'); conn.send({ type: 'join', teamId: null }); render(); };

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ARROW = { up: '↑', down: '↓', left: '←', right: '→' };
  const roundKey = () => state.question + ':' + state.armAt;

  // Что сейчас показывать на кнопке. mode: go — можно жать, locked — нажатие = фальстарт, иначе нажатия игнорируются
  function view() {
    if (!state || !myTeam) return { cls: '', text: 'Подключение…' };
    const t = conn.serverNow();
    const team = (id) => state.teams.find((x) => x.id === id) || { name: '?' };
    const pen = state.penalties[myTeam];
    const iPressed = state.presses.some((p) => p.teamId === myTeam) || localPressKey === roundKey();
    const g = state.gimmick;

    if (state.excluded.includes(myTeam)) {
      if (state.phase === 'answering' && state.winner) return { cls: 'lose', text: 'Отвечает<br>' + esc(team(state.winner).name), sub: 'вы уже отвечали' };
      return { cls: 'lose', text: 'Вы уже отвечали', sub: 'ждём следующий вопрос' };
    }
    if (pen && pen > t) return { cls: 'penalty', text: 'Фальстарт', sub: 'блок ещё ' + Math.ceil((pen - t) / 1000) + ' с', mode: 'locked' };
    if (state.phase === 'answering') {
      if (state.winner === myTeam) return { cls: 'win', text: 'ВЫ<br>ОТВЕЧАЕТЕ!', bg: team(myTeam).color };
      return { cls: 'lose', text: 'Отвечает<br>' + esc(team(state.winner).name) };
    }
    // judging для не нажавших выглядит как armed: их нажатие ещё может оказаться первым
    if (state.phase === 'armed' || state.phase === 'judging') {
      if (iPressed) return { cls: 'pressed', text: 'Нажато!', sub: state.phase === 'judging' ? 'определяем первого…' : '' };
      const open = t >= state.armAt;
      const notMine = state.oneMode && state.holders[myTeam] && state.holders[myTeam] !== myId;
      if (open && notMine) return { cls: 'lose', text: 'Кнопка<br>не у тебя 🙃' };
      if (g && g.type === 'bounce') return { cls: 'arena', text: '', ball: true, open, mode: open ? 'go' : 'locked' };
      if (open && g && (g.type === 'swipe' || g.type === 'swipe2')) return { cls: 'swipe', swipe: true, mode: 'go' };
      if (open) return { cls: 'go', text: 'ЖМИ!', mode: 'go' };
      return { cls: '', text: 'Внимание…', mode: 'locked' };
    }
    return { cls: '', text: 'Ждём<br>вопрос', sub: state.penaltyMs ? 'не жмите раньше времени — фальстарт' : '', mode: 'locked' };
  }

  function doPress(est) {
    conn.send({ type: 'press', est, rtt: conn.rtt });
    localPressKey = roundKey();
    vibrate(40);
    render();
  }

  // ---------- бегающая кнопка ----------
  // позиция — детерминированная функция времени от armAt: у всех одинаковая траектория (в долях экрана)
  function reflect(p, L) { if (L <= 0) return 0; p = ((p % (2 * L)) + 2 * L) % (2 * L); return p <= L ? p : 2 * L - p; }
  function ballRect(g, W, H, t) {
    const S = Math.max(72, Math.round(Math.min(W, H) * 0.26));
    const shrinkMs = 350;
    const k = Math.min(1, Math.max(0, (t - (state.armAt - shrinkMs)) / shrinkMs)); // сжатие перед открытием
    const run = Math.max(0, t - state.armAt) / 1000;
    const v = g.speed * W;
    const x1 = reflect(g.x * (W - S) + Math.cos(g.angle) * v * run, W - S);
    const y1 = reflect(g.y * (H - S) + Math.sin(g.angle) * v * run, H - S);
    const lerp = (a, b) => a + (b - a) * k;
    return { x: lerp(0, x1), y: lerp(0, y1), w: lerp(W, S), h: lerp(H, S), r: lerp(28, S / 2) };
  }

  // ---------- нажатия и свайпы ----------
  const buzz = $('buzz');
  buzz.addEventListener('pointerdown', (e) => {
    const est = conn.serverNow(); // время фиксируем первым делом
    e.preventDefault();
    keepAwake();
    const v = view();
    if (v.ball) {
      // попали ли в кнопку (с небольшим запасом)
      const r = $('ball').getBoundingClientRect();
      const pad = 12;
      const hit = e.clientX >= r.left - pad && e.clientX <= r.right + pad && e.clientY >= r.top - pad && e.clientY <= r.bottom + pad;
      if (!hit) return;
      if (v.mode === 'go') doPress(est); else conn.send({ type: 'early', est });
      return;
    }
    if (v.swipe) {
      if (swipe.key !== roundKey()) swipe = { key: roundKey(), stage: 0 };
      swipe.tracking = true; swipe.x = e.clientX; swipe.y = e.clientY;
      buzz.setPointerCapture(e.pointerId);
      return;
    }
    if (v.mode === 'go') doPress(est);
    else if (v.mode === 'locked') conn.send({ type: 'early', est });
  });

  buzz.addEventListener('pointermove', (e) => {
    if (!swipe.tracking) return;
    const v = view();
    if (!v.swipe) { swipe.tracking = false; return; }
    const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    const TH = 60;
    if (Math.hypot(dx, dy) < TH) return;
    const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
    const need = state.gimmick.dirs;
    swipe.x = e.clientX; swipe.y = e.clientY; // следующий отрезок считаем от текущей точки (можно одним движением «уголком»)
    if (dir === need[swipe.stage]) {
      swipe.stage++;
      vibrate(15);
      if (swipe.stage >= need.length) { swipe.tracking = false; doPress(conn.serverNow()); return; }
    } else if (swipe.stage === 0 || dir !== need[swipe.stage - 1]) {
      swipe.stage = 0; // не туда — начинай заново
      buzz.classList.remove('shake'); void buzz.offsetWidth; buzz.classList.add('shake');
    }
    render();
  });
  const endTrack = () => (swipe.tracking = false);
  buzz.addEventListener('pointerup', endTrack);
  buzz.addEventListener('pointercancel', endTrack);
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  // ---------- отрисовка ----------
  let lastHtml = '';
  function render() {
    if (!state) return;
    $('picker').classList.toggle('hidden', !!myTeam);
    $('game').classList.toggle('hidden', !myTeam);
    if (!myTeam) {
      const html = state.teams.map((t) => `<button class="team-btn" style="background:${t.color}" data-id="${t.id}">${esc(t.name)}</button>`).join('');
      if ($('teamList').innerHTML !== html) {
        $('teamList').innerHTML = html;
        $('teamList').querySelectorAll('button').forEach((b) => (b.onclick = () => pickTeam(b.dataset.id)));
      }
      return;
    }
    const me = state.teams.find((t) => t.id === myTeam);
    $('teamName').textContent = me.name;
    $('teamName').style.color = me.color;
    $('teamScore').textContent = me.score;

    const v = view();
    let html;
    if (v.swipe) {
      if (swipe.key !== roundKey()) swipe = { key: roundKey(), stage: 0 };
      const dirs = state.gimmick.dirs;
      html = `<div class="arrows">${dirs.map((d, i) => `<span class="${i < swipe.stage ? 'done' : i === swipe.stage ? 'next' : ''}">${ARROW[d]}</span>`).join('')}</div>`
        + `<small>${dirs.length > 1 ? 'свайпни ' + dirs.map((d) => ARROW[d]).join(' потом ') : 'свайпни ' + ARROW[dirs[0]]}</small>`;
    } else {
      html = (v.text || '') + (v.sub ? `<small>${v.sub}</small>` : '');
    }
    if (html !== lastHtml) { $('buzzText').innerHTML = html; lastHtml = html; }
    const keepShake = buzz.classList.contains('shake');
    buzz.className = v.cls + (keepShake ? ' shake' : '');
    buzz.style.background = v.bg || '';

    const ball = $('ball');
    if (v.ball) {
      const W = buzz.clientWidth, H = buzz.clientHeight;
      const r = ballRect(state.gimmick, W, H, conn.serverNow());
      ball.classList.remove('hidden');
      ball.classList.toggle('wait', !v.open);
      ball.style.width = r.w + 'px'; ball.style.height = r.h + 'px';
      ball.style.borderRadius = r.r + 'px';
      ball.style.transform = `translate(${r.x}px, ${r.y}px)`;
      ball.textContent = v.open ? 'ЖМИ' : '…';
    } else ball.classList.add('hidden');
  }
  buzz.addEventListener('animationend', (e) => { if (e.animationName === 'shake') buzz.classList.remove('shake'); });

  function renderNet() {
    const n = $('net');
    n.className = conn.online ? (conn.rtt != null && conn.rtt > 250 ? 'slow' : 'ok') : '';
    $('ping').textContent = conn.online && conn.lastRtt != null ? Math.round(conn.lastRtt) + ' мс' : '';
  }

  // плавная перерисовка (бегающая кнопка, открытие в armAt, отсчёт штрафа)
  (function loop() { render(); requestAnimationFrame(loop); })();
  setInterval(renderNet, 1000);
</script>
</body>
</html>
